name: Deploy to GitHub Pages

# Le site est statique : on publie le depot tel quel, sans etape de build.
on:
  push:
    branches:
      - main
      - claude/game-responsive-app-install-asybmz
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul deploiement a la fois ; on garde le dernier pousse.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
