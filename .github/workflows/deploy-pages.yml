name: Deploy to GitHub Pages

# Le site est statique : on publie le depot tel quel, sans etape de build.
on:
  push:
    branches:
      - main
      - claude/game-responsive-app-install-asybmz
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul deploiement a la fois ; on garde le dernier pousse.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # enablement: true active GitHub Pages (source = GitHub Actions) au premier
      # passage, il n'y a donc rien a cocher a la main dans les reglages du depot.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Le jeton d'Actions ne peut pas toujours creer le site Pages lui-meme
      # ("Resource not accessible by integration") : dans ce cas on dit quoi faire.
      - name: Que faire si Pages n'est pas encore active
        if: failure()
        run: |
          echo "::error title=Pages a activer une fois::Settings > Pages > Build and deployment > Source = GitHub Actions, puis relancer ce workflow (Actions > Deploy to GitHub Pages > Run workflow)."

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
