<style>
:root { color-scheme: only light; --page-bg: #140A26; }
html, body { margin:0; padding:0; height:100%; background-color:#140A26; overflow:hidden; }
body::before { content:''; position:fixed; inset:0; background-color:var(--page-bg); z-index:-1; }
* { -webkit-tap-highlight-color: transparent; }
a { color:#FFC145; text-decoration:none; }
a:hover { color:#FFE9A8; }
@keyframes halo{0%{opacity:.85}100%{opacity:1}}
@keyframes drift{0%{transform:translateX(-6%)}100%{transform:translateX(6%)}}
@keyframes glint{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.86)}}
@keyframes breathe{0%{transform:scale(1)}100%{transform:scale(1.03)}}
@keyframes rose{0%{opacity:0}45%{opacity:.85}100%{opacity:0}}
@keyframes grassUp{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes riseFade{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-80px);opacity:0}}
@keyframes fadeOut{to{opacity:0}}
@keyframes panelIn{0%{transform:translateY(40px);opacity:0}70%{transform:translateY(-6px);opacity:1}100%{transform:translateY(0);opacity:1}}
@keyframes popOk{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes shakeKo{0%{transform:translateX(-5px)}25%{transform:translateX(5px)}50%{transform:translateX(-3px)}75%{transform:translateX(3px)}100%{transform:translateX(0)}}
@keyframes pulseOk{0%,100%{filter:brightness(1)}50%{filter:brightness(1.3)}}
@keyframes fadeUp{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes ansA{from{transform:translateX(24px);opacity:0}70%{transform:translateX(-3px);opacity:1}to{transform:translateX(0);opacity:1}}
@keyframes ansB{from{transform:translateX(24px);opacity:0}70%{transform:translateX(-3px);opacity:1}to{transform:translateX(0);opacity:1}}
@keyframes qA{from{transform:translateX(24px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes qB{from{transform:translateX(24px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes qOut{to{transform:translateX(-24px);opacity:0}}
@keyframes crackIn{from{opacity:0}to{opacity:.35}}
@keyframes pL{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(-38px,-54px) scale(.4);opacity:0}}
@keyframes pC{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(0,-68px) scale(.4);opacity:0}}
@keyframes pR{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(38px,-54px) scale(.4);opacity:0}}
@keyframes burst{0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(-110px) scale(.5);opacity:0}}
@keyframes zoomIn{0%{transform:scale(.9);opacity:0}60%{transform:scale(1.04);opacity:1}100%{transform:scale(1);opacity:1}}
@media (forced-colors: active) { * { forced-color-adjust:none; } }
@media (prefers-reduced-motion: reduce){ * { animation-duration:1ms !important; animation-iteration-count:1 !important; transition-duration:200ms !important; } }
</style>
</helmet>

<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 390, &quot;height&quot;: 844 },
  &quot;nbQuestions&quot;: { &quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 12, &quot;tsType&quot;: &quot;number&quot;, &quot;min&quot;: 4, &quot;max&quot;: 12, &quot;unit&quot;: &quot;questions&quot;, &quot;section&quot;: &quot;Règles du jeu&quot; },
  &quot;vies&quot;: { &quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 3, &quot;tsType&quot;: &quot;number&quot;, &quot;min&quot;: 1, &quot;max&quot;: 5, &quot;unit&quot;: &quot;cœurs&quot;, &quot;section&quot;: &quot;Règles du jeu&quot; },
  &quot;melangerReponses&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Règles du jeu&quot; },
  &quot;afficherExplications&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Règles du jeu&quot; }
}">
class Component extends DCLogic {
  state = {
    data: (typeof window !== "undefined" && window.QUIZ_DATA) || null,
    screen: "home", phase: "dusk",
    qz: 0, lv: 0,
    questions: [], qi: 0, chosen: null, results: [],
    leaving: false, confirmBack: false, openRecap: null,
    displayScore: 0, copied: false, liveMsg: ""
  };

  componentDidMount() {
    this.rm = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    if (!this.state.data) {
      this._poll = setInterval(() => {
        if (window.QUIZ_DATA) { clearInterval(this._poll); this.setState({ data: window.QUIZ_DATA }); }
      }, 60);
    }
    this._key = (e) => this.onKey(e);
    window.addEventListener("keydown", this._key);
    this.paint("#140A26");
  }

  componentWillUnmount() {
    clearInterval(this._poll);
    window.removeEventListener("keydown", this._key);
  }

  paint(c) {
    document.documentElement.style.setProperty("--page-bg", c);
    document.documentElement.style.backgroundColor = c;
    document.body.style.backgroundColor = c;
  }

  shuf(a) {
    const b = a.slice();
    for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = b[i]; b[i] = b[j]; b[j] = t; }
    return b;
  }

  get nb() { const n = parseInt(this.props.nbQuestions, 10); return isNaN(n) ? 12 : Math.max(1, Math.min(12, n)); }
  get vies() { const n = parseInt(this.props.vies, 10); return isNaN(n) ? 3 : Math.max(1, Math.min(5, n)); }

  start() {
    if (this.state.phase !== "dusk") return;
    this.setState({ phase: "rising" });
    this.paint("#87CEEB");
    const d = this.rm ? 1 : 1;
    this._t1 = setTimeout(() => this.setState({ screen: "quizzes" }), this.rm ? 300 : 1300 * d);
    this._t2 = setTimeout(() => this.setState({ phase: "day" }), this.rm ? 320 : 1800);
  }

  toHome() {
    clearTimeout(this._t1); clearTimeout(this._t2);
    this.paint("#140A26");
    this.setState({ screen: "home", phase: "dusk", chosen: null, questions: [], confirmBack: false });
  }

  toQuizzes() { this.setState({ screen: "quizzes", confirmBack: false }); }

  pickQuiz(i) { this.setState({ qz: i, screen: "levels" }); }

  begin(lv) {
    const d = this.state.data;
    if (!d) return;
    const src = d.quiz[this.state.qz].niveaux[lv].questions;
    const n = Math.min(this.nb, src.length);
    let qs = n < src.length ? this.shuf(src).slice(0, n) : src.slice();
    if (this.props.melangerReponses !== false) {
      qs = qs.map((q) => {
        const idx = this.shuf(q.r.map((_, i) => i));
        return { q: q.q, r: idx.map((i) => q.r[i]), ok: idx.indexOf(q.ok), explication: q.explication };
      });
    }
    this.setState({ lv: lv, screen: "question", questions: qs, qi: 0, chosen: null, results: [], leaving: false, openRecap: null, displayScore: 0, liveMsg: "" });
  }

  answer(i) {
    const s = this.state;
    if (s.chosen !== null || s.leaving) return;
    const q = s.questions[s.qi];
    if (!q) return;
    const ok = i === q.ok;
    this.setState({
      chosen: i,
      results: s.results.concat([ok]),
      liveMsg: ok ? "Correct" : "Incorrect, la bonne réponse était " + q.r[q.ok]
    });
  }

  next() {
    const s = this.state;
    if (s.chosen === null) return;
    if (s.qi + 1 >= s.questions.length) { this.toResult(); return; }
    const target = s.qi + 1;
    this.setState({ qi: target, chosen: null, leaving: false, liveMsg: "" });
  }

  toResult() {
    this.setState({ screen: "result", copied: false, openRecap: null });
  }

  rankFor(score, total) {
    const p = total ? score / total : 0;
    if (total && score === total) return { n: "ARCHITECTE DU NETHER", c: "#4FD9D0", m: "Sans faute. Tu as tout dans la tête, même les chiffres." };
    if (p >= 0.83) return { n: "MAÎTRE BÂTISSEUR", c: "#C08A0C", m: "Presque parfait. Il te manque deux détails de rien." };
    if (p >= 0.58) return { n: "AVENTURIER CONFIRMÉ", c: "#3B8526", m: "Solide. Tu joues bien, mais le niveau expert t'attend." };
    if (p >= 0.33) return { n: "EXPLORATEUR", c: "#8B5A2B", m: "Tu as encore des grottes à explorer. Retente !" };
    return { n: "NOUVEAU NÉ", c: "#6A6A6A", m: "Début de partie. Va casser du bois et reviens." };
  }

  quizName() { const d = this.state.data; return d ? d.quiz[this.state.qz].titre : ""; }
  levelName() { const d = this.state.data; return d ? d.quiz[this.state.qz].niveaux[this.state.lv].nom : ""; }

  shareText() {
    const s = this.state;
    const total = s.questions.length;
    const score = s.results.filter(Boolean).length;
    const r = this.rankFor(score, total);
    const squares = s.results.map((x) => (x ? "\uD83D\uDFE9" : "\uD83D\uDFE5")).join("");
    return "Quiz Minecraft 2026 — " + this.quizName() + " · " + this.levelName() + "\nScore : " + score + "/" + total + " — " + r.n + "\n" + squares;
  }

  share() {
    const txt = this.shareText();
    const fallback = () => {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(() => {
          this.setState({ copied: true });
          setTimeout(() => this.setState({ copied: false }), 1500);
        }).catch(() => {});
      }
    };
    if (navigator.share) { navigator.share({ text: txt }).catch(fallback); } else { fallback(); }
  }

  onKey(e) {
    const s = this.state;
    if (s.screen === "question" && !s.confirmBack) {
      if (s.chosen === null && e.key >= "1" && e.key <= "4") { this.answer(parseInt(e.key, 10) - 1); return; }
      if (e.key === "Enter" && s.chosen !== null) { this.next(); return; }
      if (e.key === "Escape") { this.setState({ confirmBack: true }); return; }
    }
    if (s.screen === "home" && (e.key === "Enter" || e.key === " ")) { this.start(); return; }
    if (e.key === "Escape") {
      if (s.screen === "levels") this.toQuizzes();
      else if (s.screen === "quizzes") this.toHome();
      else if (s.screen === "result") this.setState({ screen: "levels" });
    }
  }

  renderVals() {
    const s = this.state;
    const rm = this.rm;
    const day = s.phase !== "dusk";
    const total = s.questions.length;
    const score = s.results.filter(Boolean).length;
    const q = s.questions[s.qi];
    const revealed = s.chosen !== null;
    const wrong = s.results.filter((x) => !x).length;
    const left = Math.max(0, this.vies - wrong);
    const lives = [];
    for (let i = 0; i < this.vies; i++) lives.push({ live: i < left ? "color:#C4362B" : "color:#5A2621" });

    const OK = "background:#4CAF3E;color:#14300E;box-shadow:inset 4px 4px 0 0 #86DD78, inset -4px -4px 0 0 #2E7D22, 0 4px 0 0 #235E1A, 0 6px 20px rgba(76,175,62,.45);pointer-events:none";
    const KO = "background:#C4362B;color:#FFFFFF;box-shadow:inset 4px 4px 0 0 #E06A5F, inset -4px -4px 0 0 #8E2419, 0 4px 0 0 #6E1A11, 0 6px 14px rgba(0,0,0,.3);pointer-events:none";
    const av = s.qi % 2 ? "ansB" : "ansA";
    const qv = s.qi % 2 ? "qB" : "qA";

    const answers = (q ? q.r : []).map((txt, i) => {
      const isOk = q && i === q.ok;
      const mine = s.chosen === i;
      let live, mark = "", isKo = false, isPop = false;
      if (!revealed) {
        live = rm ? "" : "animation:" + av + " 220ms cubic-bezier(.34,1.4,.64,1) " + i * 45 + "ms both";
      } else if (mine && isOk) {
        live = OK + (rm ? "" : ";animation:popOk 220ms steps(3) both"); mark = "\u2713"; isPop = !rm;
      } else if (mine) {
        live = KO + (rm ? "" : ";animation:shakeKo 280ms steps(1) both"); mark = "\u2717"; isKo = !rm;
      } else if (isOk) {
        live = OK + (rm ? "" : ";animation:pulseOk 700ms ease-in-out 2"); mark = "\u2713";
      } else {
        live = "opacity:.35;filter:grayscale(.7);pointer-events:none";
      }
      return { text: txt, live: live, mark: mark, isKo: isKo, isPop: isPop, tap: () => this.answer(i) };
    });

    const recap = s.results.map((ok, i) => {
      const qq = s.questions[i];
      const open = s.openRecap === i;
      return {
        num: (i + 1 < 10 ? "0" : "") + (i + 1),
        color: ok ? "#4CAF3E" : "#C4362B",
        q: qq ? qq.q : "",
        answer: qq ? "Réponse : " + qq.r[qq.ok] : "",
        open: open,
        live: (rm ? "" : "animation:fadeUp 200ms ease-out " + Math.min(600, 40 * i) + "ms both") + (open ? ";box-shadow:inset 2px 2px 0 0 #FFFFFF, inset -2px -2px 0 0 #C4C4C4, 0 0 0 3px #3B8526" : ""),
        toggle: () => this.setState({ openRecap: open ? null : i })
      };
    });

    const rank = this.rankFor(score, total);
    const answeredCount = s.qi + (revealed ? 1 : 0);

    return {
      edition: "éd. 2026 · à jour " + (s.data ? s.data.aJour : "26.3"),
      isHome: s.screen === "home",
      isRising: s.phase === "rising" && !rm,
      isQuizzes: s.screen === "quizzes",
      isLevels: s.screen === "levels",
      isQuestion: s.screen === "question",
      isResult: s.screen === "result",
      confirmBack: s.confirmBack,

      skyDayLive: day ? "opacity:1" : "opacity:0",
      roseLive: s.phase === "rising" && !rm ? "animation:rose 1100ms 200ms linear both" : "opacity:0",
      sunLive: day ? "top:14%;transform:translateX(-50%) scale(1.35);box-shadow:0 0 50px 24px rgba(255,233,168,.5), 0 0 110px 55px rgba(242,113,44,.28)" : "",
      islandsLive: day ? "opacity:0;transform:translateY(120%);filter:brightness(2.4)" : "",
      seaLive: day ? "opacity:0;display:none" : "opacity:1",
      grassLive: day ? (rm ? "opacity:1" : "opacity:1;animation:grassUp 1000ms steps(8) 500ms both") : "opacity:0",
      cloudLive: day ? "background:#FFFFFF;opacity:.85" : "",
      homeLive: s.phase === "rising" ? "animation:fadeOut 160ms steps(3) both;pointer-events:none" : "",

      start: () => this.start(),
      toHome: () => this.toHome(),
      toQuizzes: () => this.toQuizzes(),
      pickSurvie: () => this.pickQuiz(0),
      pickMobs: () => this.pickQuiz(1),
      pickBedrock: () => this.pickQuiz(2),
      pickL1: () => this.begin(0),
      pickL2: () => this.begin(1),
      pickL3: () => this.begin(2),
      askBack: () => this.setState({ confirmBack: true }),
      cancelBack: () => this.setState({ confirmBack: false }),
      doBack: () => this.setState({ screen: "levels", confirmBack: false }),
      next: () => this.next(),
      share: () => this.share(),
      replay: () => this.setState({ screen: "levels", confirmBack: false }),

      quizTitle: this.quizName(),
      nbLabel: this.nb + " QUESTIONS",
      headerLabel: this.quizName() + " · " + this.levelName(),
      counter: Math.min(answeredCount + (revealed ? 0 : 1), total || 1) + "/" + (total || 12),
      xpLive: "width:" + (total ? Math.round((answeredCount / total) * 100) : 0) + "%",
      qText: q ? q.q : "",
      qBlockLive: rm ? "" : "animation:" + qv + " 220ms ease-out 80ms both",
      answers: answers,
      lives: lives,
      showExpl: revealed && this.props.afficherExplications !== false,
      explText: q ? q.explication : "",
      explLive: revealed && q && s.chosen === q.ok ? "border-left-color:#4CAF3E" : "border-left-color:#C4362B",
      nextLabel: s.qi + 1 >= total ? "RÉSULTAT \u203A" : "SUIVANT \u203A",

      scoreLabel: score + "/" + (total || 12),
      rankName: rank.n,
      rankLive: "color:" + rank.c,
      rankMsg: rank.m,
      perfect: total > 0 && score === total && !rm,
      recap: recap,
      shareLabel: s.copied ? "COPIÉ !" : "PARTAGER",
      liveMsg: s.liveMsg
    };
  }
}
</script>
</body>
</html>
